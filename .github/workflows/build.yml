name: Build v2rayNG APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Extract project ZIP (if present)
        run: |
          set -e
          ZIP=""
          for c in v2rayNG-panels-full.zip v2rayNG-panels-src.zip v2rayNG-panels-extended.zip v2rayNG-full.zip; do
            if [ -f "$c" ]; then ZIP="$c"; break; fi
          done
          if [ -z "$ZIP" ]; then
            ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          fi
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP ..."
            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted
            echo "Extracted OK"
            find extracted -maxdepth 4 -type d | head -40
          else
            echo "No project ZIP in repo root — using checked-out source"
            ls -la
          fi

      - name: Find Gradle project
        id: proj
        run: |
          set -e
          DIR=$(find extracted "$GITHUB_WORKSPACE" -type f -name gradlew 2>/dev/null \
            | grep -v "/\.git/" | head -1 | xargs -r dirname)
          if [ -z "$DIR" ]; then
            echo "ERROR: gradlew not found."
            find . -maxdepth 5 -type d | head -60
            exit 1
          fi
          echo "Gradle project: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure libv2ray.aar
        run: |
          set -e
          LIBS="${{ steps.proj.outputs.dir }}/app/libs"
          mkdir -p "$LIBS"
          SIZE=$(stat -c%s "$LIBS/libv2ray.aar" 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "Downloading libv2ray.aar..."
            curl -fL --retry 5 -o "$LIBS/libv2ray.aar" \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"
          fi
          if [ ! -f "$LIBS/psiphontunnel-2.0.42.aar" ]; then
            curl -fL --retry 3 -o "$LIBS/psiphontunnel-2.0.42.aar" \
              "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master/ca/psiphon/psiphontunnel/2.0.42/psiphontunnel-2.0.42.aar" || true
          fi
          ls -lh "$LIBS"
          cd /tmp && unzip -qo "$LIBS/libv2ray.aar" classes.jar
          jar tf classes.jar | grep -E "go/Seq.class|libv2ray/Libv2ray" | head

      - name: Build Debug APK
        run: |
          set -o pipefail
          cd "${{ steps.proj.outputs.dir }}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --stacktrace 2>&1 | tee build.log
          echo "Gradle exit: ${PIPESTATUS[0]}"
          grep -E "^e: |FAILURE:|Unresolved reference" build.log | head -40 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "**/build.log"
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: warn
