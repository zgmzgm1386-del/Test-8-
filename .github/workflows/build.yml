name: Build APK

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag to publish (e.g. v2.3.15-panels.1)'
        required: false
        type: string
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/torbin/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Build everything (engines + APK)
        env:
          ANDROID_NDK_VERSION: '28.2.13676358'
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        run: |
          chmod +x ci/run.sh
          bash ci/run.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-panels-apk
          path: dist/*.apk
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: v2rayNG-panels-apk
          path: dist

      - name: Upload to release
        uses: svenstaro/upload-release-action@v2
        with:
          file: dist/*.apk
          tag: ${{ inputs.release_tag }}
          overwrite: true
