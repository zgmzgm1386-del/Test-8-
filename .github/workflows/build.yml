name: Build v2rayNG APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip zip

      - name: Extract project ZIP if present
        run: |
          set -e
          ZIP=""
          # Pick the MOST RECENTLY COMMITTED zip at repo root, so an old leftover zip
          # can never shadow a newly uploaded one.
          if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            ZIP=$(for f in *.zip; do
                    [ -f "$f" ] || continue
                    T=$(git log -1 --format=%ct -- "$f" 2>/dev/null || echo 0)
                    echo "$T $f"
                  done | sort -rn | head -1 | cut -d' ' -f2-)
          fi
          [ -z "$ZIP" ] && for c in v2rayNG-panels-src-v3.zip v2rayNG-panels-src.zip v2rayNG-panels-full.zip v2rayNG-panels-extended.zip v2rayNG-full.zip; do
            [ -f "$c" ] && ZIP="$c" && break
          done
          [ -z "$ZIP" ] && ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Chosen ZIP: $ZIP ($(stat -c%s "$ZIP") bytes)"
            unzip -p "$ZIP" v2rayNG-full/VERSION.txt 2>/dev/null || echo "(zip has no VERSION.txt marker)"
            if unzip -p "$ZIP" "v2rayNG-full/V2rayNG/app/src/main/java/com/v2ray/ang/ui/panels/DisruptionActivity.kt" 2>/dev/null | grep -q "^import android\.content\.Intent$"; then
              echo "OK: ZIP already contains the DisruptionActivity fix (BUILD-FIX-3)"
            else
              echo "::warning::This ZIP is the OLD version. The Patch step will add the missing import automatically."
            fi
            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted
          else
            echo "No ZIP; using repo source"
          fi

      - name: Locate Gradle project
        id: proj
        run: |
          set -e
          FOUND=$(find "$GITHUB_WORKSPACE/extracted" "$GITHUB_WORKSPACE" -type f -name gradlew 2>/dev/null | grep -v "/\.git/" | head -1 || true)
          if [ -z "$FOUND" ]; then
            echo "gradlew not found"
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type d | head -50
            exit 1
          fi
          DIR=$(cd "$(dirname "$FOUND")" && pwd)
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Using $DIR"

      - name: Patch known source issue (BUILD-FIX-3, idempotent)
        run: |
          set -e
          DIR="${{ steps.proj.outputs.dir }}"
          F="$DIR/app/src/main/java/com/v2ray/ang/ui/panels/DisruptionActivity.kt"
          if [ -f "$F" ] && ! grep -q "^import android\.content\.Intent$" "$F"; then
            sed -i 's/^import android\.content\.IntentFilter$/import android.content.Intent\nimport android.content.IntentFilter/' "$F"
            echo "PATCHED: added missing 'import android.content.Intent' to DisruptionActivity.kt"
            grep -n "import android.content" "$F"
          else
            echo "Patch not needed (import already present)"
          fi

      - name: Android SDK
        run: |
          set -e
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_ROOT/cmdline-tools/latest"
          cp -a /tmp/cmdline-tools/. "$ANDROID_ROOT/cmdline-tools/latest/"
          export ANDROID_HOME="$ANDROID_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37" "platforms;android-35" "build-tools;35.0.0" "build-tools;37.0.0" 2>/dev/null \
            || sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Native AARs
        run: |
          set -e
          LIBS="${{ steps.proj.outputs.dir }}/app/libs"
          mkdir -p "$LIBS"

          # libv2ray (required)
          SZ=$(stat -c%s "$LIBS/libv2ray.aar" 2>/dev/null || echo 0)
          if [ "$SZ" -lt 1000000 ]; then
            curl -fL --retry 5 -o "$LIBS/libv2ray.aar" \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"
          fi

          # Psiphon Java API only (strip go + jni to avoid clash with libv2ray)
          if [ ! -f "$LIBS/psiphontunnel-2.0.42.aar" ]; then
            curl -fL --retry 3 -o "$LIBS/psiphontunnel-2.0.42.aar" \
              "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master/ca/psiphon/psiphontunnel/2.0.42/psiphontunnel-2.0.42.aar" || true
          fi
          if [ -f "$LIBS/psiphontunnel-2.0.42.aar" ]; then
            W=$(mktemp -d)
            (
              cd "$W"
              unzip -q "$LIBS/psiphontunnel-2.0.42.aar"
              rm -rf jni
              if [ -f classes.jar ]; then
                mkdir cj
                (cd cj && jar xf ../classes.jar && rm -rf go && jar cf ../classes.jar .)
                rm -rf cj
              fi
              zip -q -r fixed.aar .
              cp -f fixed.aar "$LIBS/psiphontunnel-2.0.42.aar"
            )
            rm -rf "$W"
            echo "Psiphon AAR sanitized"
          fi

          ls -lh "$LIBS"
          test "$(stat -c%s "$LIBS/libv2ray.aar")" -gt 1000000

      - name: Build
        run: |
          set -o pipefail
          cd "${{ steps.proj.outputs.dir }}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --stacktrace --no-daemon 2>&1 | tee build.log
          EC=${PIPESTATUS[0]}
          echo "exit=$EC"
          grep -E "^e: |FAILURE:|Duplicate|More than one file|Unexpected symbol|Unresolved" build.log | head -40 || true
          exit "$EC"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "**/build.log"
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: warn
