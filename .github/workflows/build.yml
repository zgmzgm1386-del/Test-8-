
name: Build v2rayNG APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install archive tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="v2rayNG-panels-src.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::ZIP file not found: $ZIP_FILE"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/extracted"
          unzip -q -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/extracted"

          echo "SOURCE_ROOT=$GITHUB_WORKSPACE/extracted" >> "$GITHUB_ENV"

      - name: Find Gradle wrapper
        id: project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(find "$SOURCE_ROOT" -type f -name gradlew -not -path '*/.git/*' -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew not found"
            exit 1
          fi

          PROJECT_DIR="$(cd "$(dirname "$GRADLEW")" && pwd)"
          chmod +x "$GRADLEW"

          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-37" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Download required AAR dependencies
        shell: bash
        run: |
          set -euo pipefail

          LIBS="$PROJECT_DIR/app/libs"
          mkdir -p "$LIBS"

          XRAY_AAR="$LIBS/libv2ray.aar"

          if [ ! -s "$XRAY_AAR" ] || [ "$(stat -c%s "$XRAY_AAR")" -lt 1000000 ]; then
            rm -f "$XRAY_AAR"

            curl --fail --location --show-error \
              --retry 5 --retry-all-errors \
              --output "$XRAY_AAR" \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"
          fi

          if [ ! -s "$XRAY_AAR" ]; then
            echo "::error::libv2ray.aar download failed"
            exit 1
          fi

          PSIPHON_AAR="$LIBS/psiphontunnel-2.0.42.aar"

          if [ ! -s "$PSIPHON_AAR" ]; then
            curl --fail --location --show-error \
              --retry 5 --retry-all-errors \
              --output "$PSIPHON_AAR" \
              "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master/ca/psiphon/psiphontunnel/2.0.42/psiphontunnel-2.0.42.aar"
          fi

          if [ ! -s "$PSIPHON_AAR" ]; then
            echo "::error::Psiphon AAR download failed"
            exit 1
          fi

          ls -lh "$LIBS"

      - name: Verify AAR files
        shell: bash
        run: |
          set -euo pipefail

          LIBS="$PROJECT_DIR/app/libs"

          unzip -tq "$LIBS/libv2ray.aar"
          unzip -tq "$LIBS/psiphontunnel-2.0.42.aar"

          echo "AAR verification passed"

      - name: Build Debug APK
        shell: bash
        run: |
          set -uo pipefail

          cd "$PROJECT_DIR"

          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

          chmod +x ./gradlew

          ./gradlew assembleFdroidDebug \
            --stacktrace \
            --no-daemon \
            --warning-mode all 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

          GRADLE_EXIT="${PIPESTATUS[0]}"

          echo "===== BUILD ERRORS ====="

          grep -n -E \
            '(^e: |FAILURE:|What went wrong:|Unresolved reference|Could not resolve|Could not find)' \
            "$GITHUB_WORKSPACE/build.log" | head -150 || true

          exit "$GRADLE_EXIT"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: v2rayNG-debug-apk
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/fdroid/debug/**/*.apk
          if-no-files-found: error
          retention-days: 14
