name: Build v2rayNG APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip zip

      - name: Extract project ZIP (if present)
        run: |
          set -e
          ZIP=""
          for c in v2rayNG-panels-full.zip v2rayNG-panels-src.zip v2rayNG-panels-extended.zip v2rayNG-full.zip; do
            [ -f "$c" ] && ZIP="$c" && break
          done
          [ -z "$ZIP" ] && ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted
          else
            echo "No ZIP — using checkout source"
            ls -la
          fi

      - name: Find Gradle project
        id: proj
        run: |
          set -e
          FOUND=$(find "$GITHUB_WORKSPACE/extracted" "$GITHUB_WORKSPACE" -type f -name gradlew 2>/dev/null | grep -v "/\.git/" | head -1 || true)
          if [ -z "$FOUND" ]; then
            echo "ERROR: gradlew not found"
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type d | head -80
            exit 1
          fi
          DIR=$(cd "$(dirname "$FOUND")" && pwd)
          echo "Gradle project: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Setup Android SDK (manual, no obsolete tools package)
        run: |
          set -e
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_ROOT/cmdline-tools/latest"
          cp -a /tmp/cmdline-tools/. "$ANDROID_ROOT/cmdline-tools/latest/"
          export ANDROID_HOME="$ANDROID_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          # Match compileSdk 37 in app/build.gradle.kts
          sdkmanager "platform-tools" "platforms;android-37" "platforms;android-35" "build-tools;35.0.0" "build-tools;37.0.0" || \
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          ls "$ANDROID_HOME/platforms" || true

      - name: Ensure libv2ray.aar + strip Psiphon go.Seq
        run: |
          set -e
          LIBS="${{ steps.proj.outputs.dir }}/app/libs"
          mkdir -p "$LIBS"
          echo "LIBS=$LIBS"

          SIZE=$(stat -c%s "$LIBS/libv2ray.aar" 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "Downloading libv2ray.aar..."
            curl -fL --retry 5 -o "$LIBS/libv2ray.aar" \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"
          fi

          if [ ! -f "$LIBS/psiphontunnel-2.0.42.aar" ]; then
            curl -fL --retry 3 -o "$LIBS/psiphontunnel-2.0.42.aar" \
              "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master/ca/psiphon/psiphontunnel/2.0.42/psiphontunnel-2.0.42.aar" || true
          fi

          # CRITICAL: both AARs ship go.Seq — remove go/* from Psiphon only
          if [ -f "$LIBS/psiphontunnel-2.0.42.aar" ]; then
            WORK=$(mktemp -d)
            (
              cd "$WORK"
              unzip -q "$LIBS/psiphontunnel-2.0.42.aar"
              if [ -f classes.jar ]; then
                mkdir cj && (cd cj && jar xf ../classes.jar && rm -rf go && jar cf ../classes.jar .)
                rm -rf cj
                zip -q -r fixed.aar .
                cp -f fixed.aar "$LIBS/psiphontunnel-2.0.42.aar"
                echo "Stripped go.* from Psiphon AAR"
              fi
            )
            rm -rf "$WORK"
          fi

          ls -lh "$LIBS"
          test -f "$LIBS/libv2ray.aar"
          test "$(stat -c%s "$LIBS/libv2ray.aar")" -gt 1000000

          VERIFY=$(mktemp -d)
          unzip -qo "$LIBS/libv2ray.aar" classes.jar -d "$VERIFY"
          jar tf "$VERIFY/classes.jar" | grep -E "go/Seq.class|libv2ray/Libv2ray" | head
          rm -rf "$VERIFY"
          echo "libv2ray OK"

      - name: Build Debug APK
        run: |
          set -o pipefail
          cd "${{ steps.proj.outputs.dir }}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          # Single flavor to reduce time/noise
          ./gradlew assembleFdroidDebug --stacktrace --no-daemon 2>&1 | tee build.log
          EC=${PIPESTATUS[0]}
          echo "Gradle exit: $EC"
          echo "==== KEY ERRORS ===="
          grep -E "^e: |FAILURE:|Duplicate class|Unresolved reference|What went wrong" build.log | head -60 || true
          exit $EC

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "**/build.log"
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: warn
