name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rust (stable + Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      # Everything else (NDK, cargo-ndk, Rust core, SlipNet, Tor, Psiphon,
      # flutter create + overlay, flutter build apk) lives in ci/run.sh,
      # so fixing the build never requires editing this file again.
      - name: Build
        run: bash ci/run.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panels-manager-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
