name: Build v2rayNG APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install unzip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq unzip

      - name: Extract project ZIP (if present)
        run: |
          set -e
          ZIP=""
          for c in v2rayNG-panels-full.zip v2rayNG-panels-src.zip v2rayNG-panels-extended.zip v2rayNG-full.zip; do
            [ -f "$c" ] && ZIP="$c" && break
          done
          [ -z "$ZIP" ] && ZIP=$(ls -1 *.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Extracting $ZIP"
            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted
          else
            echo "No ZIP — using checkout"
            ls -la
          fi

      - name: Find Gradle project
        id: proj
        run: |
          set -e
          # Always resolve to absolute path
          FOUND=$(find "$GITHUB_WORKSPACE/extracted" "$GITHUB_WORKSPACE" -type f -name gradlew 2>/dev/null | grep -v "/\.git/" | head -1 || true)
          if [ -z "$FOUND" ]; then
            echo "ERROR: gradlew not found"
            find "$GITHUB_WORKSPACE" -maxdepth 6 -type d | head -80
            exit 1
          fi
          DIR=$(cd "$(dirname "$FOUND")" && pwd)
          echo "Gradle project: $DIR"
          echo "dir=$DIR" >> $GITHUB_OUTPUT

      - name: Setup Android SDK (manual)
        run: |
          set -e
          ANDROID_ROOT=$HOME/android-sdk
          mkdir -p "$ANDROID_ROOT/cmdline-tools"
          cd /tmp
          curl -fL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf /tmp/cmdline-tools
          unzip -q cmdtools.zip
          rm -rf "$ANDROID_ROOT/cmdline-tools/latest"
          mkdir -p "$ANDROID_ROOT/cmdline-tools/latest"
          # commandlinetools zip top-level folder is "cmdline-tools"
          cp -a /tmp/cmdline-tools/. "$ANDROID_ROOT/cmdline-tools/latest/"
          export ANDROID_HOME="$ANDROID_ROOT"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "SDK ready: $ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"

      - name: Ensure libv2ray.aar
        run: |
          set -e
          # dir is ABSOLUTE from previous step
          LIBS="${{ steps.proj.outputs.dir }}/app/libs"
          mkdir -p "$LIBS"
          echo "LIBS=$LIBS"

          SIZE=$(stat -c%s "$LIBS/libv2ray.aar" 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "Downloading libv2ray.aar..."
            curl -fL --retry 5 -o "$LIBS/libv2ray.aar" \
              "https://github.com/2dust/AndroidLibXrayLite/releases/download/v26.10.31/libv2ray.aar"
          fi

          if [ ! -f "$LIBS/psiphontunnel-2.0.42.aar" ]; then
            curl -fL --retry 3 -o "$LIBS/psiphontunnel-2.0.42.aar" \
              "https://raw.githubusercontent.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master/ca/psiphon/psiphontunnel/2.0.42/psiphontunnel-2.0.42.aar" || true
          fi

          ls -lh "$LIBS"
          test -f "$LIBS/libv2ray.aar"
          test "$(stat -c%s "$LIBS/libv2ray.aar")" -gt 1000000

          # Verify contents WITHOUT changing cwd dependency on relative paths
          VERIFY_DIR=$(mktemp -d)
          unzip -qo "$LIBS/libv2ray.aar" classes.jar -d "$VERIFY_DIR"
          jar tf "$VERIFY_DIR/classes.jar" | grep -E "go/Seq.class|libv2ray/Libv2ray" | head
          rm -rf "$VERIFY_DIR"
          echo "libv2ray.aar OK"

      - name: Build Debug APK
        run: |
          set -o pipefail
          cd "${{ steps.proj.outputs.dir }}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleFdroidDebug --stacktrace 2>&1 | tee build.log
          echo "Gradle exit: ${PIPESTATUS[0]}"
          grep -E "^e: |FAILURE:|Unresolved reference" build.log | head -50 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "**/build.log"
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: "**/app/build/outputs/apk/**/*.apk"
          if-no-files-found: warn
