name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # پروژه را هر جای ریپو باشد (ریشه یا داخل زیرپوشه) پیدا می‌کند
      - name: Locate project
        run: |
          RUN=$(find . -path ./.git -prune -o -type f -path '*/ci/run.sh' -print | head -n1)
          if [ -z "$RUN" ]; then
            echo "::error::ci/run.sh پیدا نشد — پوشهٔ ci آپلود نشده. فایل‌های ریپو:"
            find . -path ./.git -prune -o -maxdepth 2 -print | head -50
            exit 1
          fi
          DIR=$(dirname "$(dirname "$RUN")")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "project dir: $DIR"

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Rust (stable + Android target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: bash ci/run.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: panels-manager-apk
          path: ${{ env.PROJECT_DIR }}/dist/*.apk
          if-no-files-found: error
          retention-days: 30
